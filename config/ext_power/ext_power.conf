## Actively switch the nice!nano's VCC output on (P0.13 high) instead of leaving
## the switch undriven, which charybdis.conf does with CONFIG_ZMK_EXT_POWER=n.
## The trackball sensor runs off VCC. On Cakerybdis 0's right-half clone, VCC
## didn't stay up on battery with P0.13 undriven: the trackball was dead unless
## the board booted on USB with the battery off, and Bluetooth typing lagged.
## Costs some extra deep-sleep current (280Zo issue #17), so only that half uses it.
CONFIG_ZMK_EXT_POWER=y
