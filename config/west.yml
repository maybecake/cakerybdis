# West manifest: every external repo the firmware build downloads.
#
# All projects are pinned to exact commit SHAs, so the same source always
# builds the same firmware. To update a dependency, see "Dependencies" in
# FORK.md.
#
# Project `name`s (and therefore checkout paths) must stay as-is: the local
# build script and CI reference them. `repo-path` points at the cakerybdis-*
# forks on GitHub.

manifest:
  remotes:
    - name: maybecake
      url-base: https://github.com/maybecake

  projects:
    # ZMK (fork of zmkfirmware/zmk, branch `cakerybdis`)
    # = upstream 9ebbeff0 (2026-09-14) + split-central disconnect fix
    #   + Zephyr pinned to 10ba6d0cb38b in app/west.yml.
    # Pulls in Zephyr + HALs via app/west.yml.
    - name: zmk
      remote: maybecake
      repo-path: cakerybdis-zmk
      revision: 8e99aa8f7ec27bde4581a28c8f68f41a917c9907
      import: app/west.yml

    # PMW3610 trackball driver (fork of 280Zo/zmk-pmw3610-driver)
    # 2026-03-28 merge upstream changes and resolve conflicts
    - name: zmk-pmw3610-driver
      remote: maybecake
      repo-path: cakerybdis-zmk-pmw3610-driver
      revision: f6e234367b22508b5c0a6bcc82437c64f320089b

    # Prospector display dongle module (fork of 280Zo/prospector-zmk-module)
    # 2026-05-21 Add keyboard controls for Prospector display brightness
    - name: prospector-zmk-module
      remote: maybecake
      repo-path: cakerybdis-prospector-zmk-module
      revision: 45f174c62bfffc5729e8cb1554e12f4544f54554

  self:
    path: config
