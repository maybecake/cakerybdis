## Split keyboards
## https://zmk.dev/docs/config/system#split-keyboards
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=1
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

## ZMK Studio
## https://zmk.dev/docs/features/studio
CONFIG_ZMK_STUDIO=y
## https://zmk.dev/docs/config/studio
CONFIG_ZMK_STUDIO_LOCKING=y
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=y
CONFIG_ZMK_STUDIO_TRANSPORT_BLE_PREF_LATENCY=5

CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_INPUT_LISTENER=y

## PMW3610 Driver
## https://github.com/badjeff/zmk-pmw3610-driver
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_PMW3610_ALT=y
CONFIG_ZMK_POINTING=y
#CONFIG_SPI_LOG_LEVEL_DBG=y

## https://github.com/badjeff/zmk-pmw3610-driver/blob/main/src/pmw3610.c
CONFIG_PMW3610_ALT_SMART_ALGORITHM=y
# CONFIG_PMW3610_ALT_LOG_LEVEL_DBG=y

## Swap/Invert are now DTS properties in pixart,pmw3610-alt - see charybdis_pmw3610.dtsi
# CONFIG_PMW3610_ALT_SWAP_XY=y // deprecated
# CONFIG_PMW3610_ALT_INVERT_X=y // deprecated
# CONFIG_PMW3610_ALT_INVERT_Y=y // deprecated
CONFIG_PMW3610_ALT_REPORT_INTERVAL_MIN=12

CONFIG_PMW3610_ALT_REST1_SAMPLE_TIME_MS=100
CONFIG_PMW3610_ALT_REST2_SAMPLE_TIME_MS=200
CONFIG_PMW3610_ALT_REST3_SAMPLE_TIME_MS=300
CONFIG_PMW3610_ALT_RUN_DOWNSHIFT_TIME_MS=2000
CONFIG_PMW3610_ALT_REST1_DOWNSHIFT_TIME_MS=3000
CONFIG_PMW3610_ALT_REST2_DOWNSHIFT_TIME_MS=30000
# CONFIG_PMW3610_ALT_INIT_POWER_UP_EXTRA_DELAY_MS=300 // <--see Troubleshooting

## Bluetooth pairing stability
## Prevent our own auto-negotiated PHY/data-length/conn-param updates from
## colliding with an in-flight SMP pairing procedure (seen as disconnect
## reason 0x23 LL_PROC_COLLISION when pairing with Windows).
CONFIG_BT_AUTO_PHY_UPDATE=n
CONFIG_BT_AUTO_DATA_LEN_UPDATE=n
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n

## Enable passkey entry so pairing can be MITM-authenticated. Without this,
## IO capability is NoInputNoOutput (Just Works only), which some Android
## builds refuse for HID devices (seen as Security failed err 1 AUTH_FAIL).
CONFIG_ZMK_BLE_PASSKEY_ENTRY=y

## Per-key RGB LEDs (SK6812) - see charybdis_common/charybdis_underglow.dtsi
## Pressed keys light up in a random rainbow colour (boards/src/per_key_led.c,
## enabled by the cake,per-key-led node in the overlay). Replaces the stock
## underglow effects, which would fight over the same strip.
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_CAKE_PER_KEY_LED=y
# Percent of full LED output (the rainbow test ran at ~10%)
CONFIG_CAKE_PER_KEY_LED_BRIGHTNESS=20
CONFIG_CAKE_PER_KEY_LED_FADE_MS=500
