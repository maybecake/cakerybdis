CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

## RGB LEDs (SK6812) - see charybdis_common/charybdis_underglow.dtsi
## https://zmk.dev/docs/features/underglow
CONFIG_ZMK_RGB_UNDERGLOW=y
# No ext-power toggling: CONFIG_ZMK_EXT_POWER=n in charybdis.conf (VCC stays on)
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
# Effects: 0 solid, 1 breathe, 2 spectrum, 3 swirl (rainbow across the chain)
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=100
# Keep current low: the LEDs run off the nice!nano's 3.3V VCC regulator
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=20
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=50
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
